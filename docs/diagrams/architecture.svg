<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1185" width="1720" height="1185" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .t { fill: #1F2937; }
      .muted { fill: #6B7280; }
      .h { font-weight: 700; }
      .box { fill: #FFFFFF; stroke-width: 1.2; }
      .line { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6B7280; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .badge circle { fill: #1F3864; }
      .badge text { fill: #FFFFFF; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .lg text { font-size: 10px; }
      .chip { fill: #FFFFFF; stroke: #C77C0E; stroke-width: 1; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1F2937; }
    </style>
  </defs>

  <rect x="0" y="0" width="1720" height="1185" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="52" class="t h" font-size="26">Salary Management for ACME HR: High Level Design</text>
  <text x="40" y="80" class="muted" font-size="14">Version 0.3, 24 Sep 2026. Based on the answered clarification questions and follow-up decisions.</text>

  <!-- HR managers -->
  <g stroke="#1F2937" stroke-width="2" fill="none">
    <circle cx="130" cy="175" r="18"/>
    <line x1="130" y1="193" x2="130" y2="240"/>
    <line x1="105" y1="212" x2="155" y2="212"/>
    <line x1="130" y1="240" x2="110" y2="275"/>
    <line x1="130" y1="240" x2="150" y2="275"/>
  </g>
  <text x="130" y="300" class="t h" font-size="15" text-anchor="middle">HR managers</text>
  <text x="130" y="318" class="muted" font-size="12" text-anchor="middle">Global or one country</text>

  <!-- Browser zone -->
  <rect x="260" y="110" width="360" height="450" rx="12" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="1.5"/>
  <text x="280" y="138" class="t h" font-size="16">Browser: React single page app</text>
  <text x="280" y="156" class="muted" font-size="12">React, Vite, TypeScript</text>

  <rect x="280" y="170" width="320" height="170" rx="8" class="box" stroke="#3B6FD8"/>
  <text x="296" y="194" class="t h" font-size="14">Screens</text>
  <text x="296" y="218" class="t" font-size="13">Login, reset password, accept invite</text>
  <text x="296" y="240" class="t" font-size="13">Dashboard with USD toggle</text>
  <text x="296" y="262" class="t" font-size="13">Employees: search, filter, paging</text>
  <text x="296" y="284" class="t" font-size="13">Employee record, pay and history</text>
  <text x="296" y="306" class="t" font-size="13">Pay components and users</text>
  <text x="296" y="328" class="t" font-size="13">Import and export</text>

  <rect x="280" y="355" width="320" height="100" rx="8" class="box" stroke="#3B6FD8"/>
  <text x="296" y="379" class="t h" font-size="14">Client data layer</text>
  <text x="296" y="400" class="t" font-size="13">TanStack Query (server state, cache)</text>
  <text x="296" y="420" class="t" font-size="13">TanStack Table, React Hook Form</text>
  <text x="296" y="440" class="t" font-size="13">shadcn/ui on Radix, Recharts</text>

  <rect x="280" y="470" width="320" height="72" rx="8" class="box" stroke="#3B6FD8" stroke-dasharray="5 4"/>
  <text x="296" y="494" class="t h" font-size="14">packages/shared</text>
  <text x="296" y="514" class="t" font-size="13">Zod schemas and types for UI and API</text>
  <text x="296" y="532" class="muted" font-size="12">One set of validation rules</text>

  <!-- Vercel zone -->
  <rect x="690" y="110" width="200" height="450" rx="12" fill="#F4F4F5" stroke="#52525B" stroke-width="1.5"/>
  <text x="706" y="138" class="t h" font-size="16">Vercel</text>
  <text x="706" y="156" class="muted" font-size="12">Hosting for the UI</text>

  <rect x="706" y="170" width="168" height="110" rx="8" class="box" stroke="#52525B"/>
  <text x="720" y="194" class="t h" font-size="14">CDN</text>
  <text x="720" y="216" class="t" font-size="13">Serves the built</text>
  <text x="720" y="234" class="t" font-size="13">React app (HTML,</text>
  <text x="720" y="252" class="t" font-size="13">JS and CSS)</text>

  <rect x="706" y="330" width="168" height="125" rx="8" class="box" stroke="#52525B"/>
  <text x="720" y="354" class="t h" font-size="14">Rewrite /api/*</text>
  <text x="720" y="376" class="t" font-size="13">Forwards API calls</text>
  <text x="720" y="394" class="t" font-size="13">to Render. Same</text>
  <text x="720" y="412" class="t" font-size="13">origin, so the auth</text>
  <text x="720" y="430" class="t" font-size="13">cookie is first-party</text>

  <!-- API zone -->
  <rect x="960" y="110" width="500" height="450" rx="12" fill="#EEF8F1" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="980" y="138" class="t h" font-size="16">Render: API service</text>
  <text x="980" y="156" class="muted" font-size="12">Node.js 24 LTS, Express 5, TypeScript</text>

  <rect x="980" y="170" width="460" height="70" rx="8" class="box" stroke="#2E8B57"/>
  <text x="996" y="192" class="t h" font-size="14">Middleware</text>
  <text x="996" y="212" class="t" font-size="12.5">Security headers, rate limits, JWT cookie check</text>
  <text x="996" y="230" class="t" font-size="12.5">Role and country scope, Zod validation, problem+json errors</text>

  <text x="980" y="262" class="t h" font-size="13">Feature modules</text>
  <g>
    <rect x="980" y="270" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1050" y="287" class="t h" font-size="12.5" text-anchor="middle">Auth</text>
    <text x="1050" y="303" class="muted" font-size="10.5" text-anchor="middle">login, reset, invite</text>
    <rect x="1140" y="270" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1210" y="287" class="t h" font-size="12.5" text-anchor="middle">Users</text>
    <text x="1210" y="303" class="muted" font-size="10.5" text-anchor="middle">roles, country scope</text>
    <rect x="1300" y="270" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1370" y="287" class="t h" font-size="12.5" text-anchor="middle">Employees</text>
    <text x="1370" y="303" class="muted" font-size="10.5" text-anchor="middle">records, search, status</text>

    <rect x="980" y="318" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1050" y="335" class="t h" font-size="12.5" text-anchor="middle">Compensation</text>
    <text x="1050" y="351" class="muted" font-size="10.5" text-anchor="middle">pay items, history</text>
    <rect x="1140" y="318" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1210" y="335" class="t h" font-size="12.5" text-anchor="middle">Pay components</text>
    <text x="1210" y="351" class="muted" font-size="10.5" text-anchor="middle">catalogue, frequencies</text>
    <rect x="1300" y="318" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1370" y="335" class="t h" font-size="12.5" text-anchor="middle">Insights</text>
    <text x="1370" y="351" class="muted" font-size="10.5" text-anchor="middle">dashboard statistics</text>

    <rect x="980" y="366" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1050" y="383" class="t h" font-size="12.5" text-anchor="middle">Exchange rates</text>
    <text x="1050" y="399" class="muted" font-size="10.5" text-anchor="middle">daily USD rates</text>
    <rect x="1140" y="366" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1210" y="383" class="t h" font-size="12.5" text-anchor="middle">Import and export</text>
    <text x="1210" y="399" class="muted" font-size="10.5" text-anchor="middle">.xlsx and CSV</text>
    <rect x="1300" y="366" width="140" height="42" rx="6" class="box" stroke="#2E8B57"/>
    <text x="1370" y="383" class="t h" font-size="12.5" text-anchor="middle">Reference data</text>
    <text x="1370" y="399" class="muted" font-size="10.5" text-anchor="middle">countries, currencies</text>
  </g>

  <text x="980" y="428" class="t h" font-size="13">Inside each module</text>
  <rect x="980" y="436" width="130" height="50" rx="6" class="box" stroke="#2E8B57"/>
  <text x="1045" y="457" class="t h" font-size="13" text-anchor="middle">Routes</text>
  <text x="1045" y="474" class="muted" font-size="11" text-anchor="middle">HTTP in and out</text>
  <line x1="1110" y1="461" x2="1133" y2="461" class="line"/>
  <rect x="1135" y="436" width="150" height="50" rx="6" class="box" stroke="#2E8B57"/>
  <text x="1210" y="457" class="t h" font-size="13" text-anchor="middle">Services</text>
  <text x="1210" y="474" class="muted" font-size="11" text-anchor="middle">business rules</text>
  <line x1="1285" y1="461" x2="1308" y2="461" class="line"/>
  <rect x="1310" y="436" width="130" height="50" rx="6" class="box" stroke="#2E8B57"/>
  <text x="1375" y="457" class="t h" font-size="13" text-anchor="middle">Repositories</text>
  <text x="1375" y="474" class="muted" font-size="11" text-anchor="middle">Drizzle ORM, scoped</text>

  <text x="980" y="512" class="muted" font-size="12">Business rules are plain functions, so most tests need no database.</text>
  <text x="980" y="532" class="muted" font-size="12">Stateless: any instance can serve any request.</text>

  <!-- Right column: scheduled job and exchange rate API -->
  <rect x="1500" y="170" width="200" height="100" rx="10" fill="#F4F4F5" stroke="#52525B" stroke-width="1.5"/>
  <text x="1516" y="194" class="t h" font-size="14">Scheduled job</text>
  <text x="1516" y="215" class="t" font-size="12.5">GitHub Actions, once a</text>
  <text x="1516" y="233" class="t" font-size="12.5">day, calls the rates</text>
  <text x="1516" y="251" class="t" font-size="12.5">refresh with a secret</text>

  <rect x="1500" y="320" width="200" height="100" rx="10" fill="#E6F6F7" stroke="#0E7C86" stroke-width="1.5"/>
  <text x="1516" y="344" class="t h" font-size="14">Frankfurter API</text>
  <text x="1516" y="365" class="t" font-size="12.5">Free exchange rates</text>
  <text x="1516" y="383" class="t" font-size="12.5">(central bank data):</text>
  <text x="1516" y="401" class="t" font-size="12.5">USD to CAD, AUD, INR</text>

  <!-- HR mailbox -->
  <rect x="40" y="610" width="180" height="80" rx="8" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="130" y="638" class="t h" font-size="14" text-anchor="middle">HR mailbox</text>
  <text x="130" y="658" class="t" font-size="12" text-anchor="middle">Reset or invite email</text>
  <text x="130" y="674" class="t" font-size="12" text-anchor="middle">with a single-use link</text>

  <!-- Brevo -->
  <rect x="690" y="610" width="200" height="110" rx="10" fill="#F6EEFF" stroke="#7A4CC2" stroke-width="1.5"/>
  <text x="706" y="636" class="t h" font-size="15">Brevo</text>
  <text x="706" y="658" class="t" font-size="13">Transactional email</text>
  <text x="706" y="676" class="t" font-size="13">API: password resets</text>
  <text x="706" y="694" class="t" font-size="13">and user invites</text>

  <!-- Seed script -->
  <rect x="420" y="725" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="520" y="750" class="t h" font-size="14" text-anchor="middle">Seed script</text>
  <text x="520" y="770" class="t" font-size="12" text-anchor="middle">10,000 employees in four</text>
  <text x="520" y="788" class="t" font-size="12" text-anchor="middle">countries, fixed seed</text>

  <!-- Neon zone -->
  <rect x="960" y="610" width="500" height="240" rx="12" fill="#FFF6E8" stroke="#C77C0E" stroke-width="1.5"/>
  <text x="980" y="638" class="t h" font-size="16">Neon: PostgreSQL</text>
  <text x="980" y="656" class="muted" font-size="12">Managed PostgreSQL, TLS, pooled connections</text>
  <rect x="980" y="668" width="90" height="28" rx="6" class="chip"/><text x="1025" y="686" class="mono" text-anchor="middle">employees</text>
  <rect x="1080" y="668" width="90" height="28" rx="6" class="chip"/><text x="1125" y="686" class="mono" text-anchor="middle">pay_items</text>
  <rect x="1180" y="668" width="105" height="28" rx="6" class="chip"/><text x="1232" y="686" class="mono" text-anchor="middle">pay_changes</text>
  <rect x="1295" y="668" width="125" height="28" rx="6" class="chip"/><text x="1357" y="686" class="mono" text-anchor="middle">pay_components</text>
  <rect x="980" y="702" width="130" height="28" rx="6" class="chip"/><text x="1045" y="720" class="mono" text-anchor="middle">pay_frequencies</text>
  <rect x="1120" y="702" width="80" height="28" rx="6" class="chip"/><text x="1160" y="720" class="mono" text-anchor="middle">fx_rates</text>
  <rect x="1210" y="702" width="90" height="28" rx="6" class="chip"/><text x="1255" y="720" class="mono" text-anchor="middle">countries</text>
  <rect x="1310" y="702" width="105" height="28" rx="6" class="chip"/><text x="1362" y="720" class="mono" text-anchor="middle">currencies</text>
  <rect x="980" y="736" width="150" height="28" rx="6" class="chip" stroke-dasharray="4 3"/><text x="1055" y="754" class="mono" text-anchor="middle">current_pay_totals</text>
  <rect x="1140" y="736" width="60" height="28" rx="6" class="chip"/><text x="1170" y="754" class="mono" text-anchor="middle">users</text>
  <rect x="1210" y="736" width="105" height="28" rx="6" class="chip"/><text x="1262" y="754" class="mono" text-anchor="middle">auth_tokens</text>
  <rect x="1325" y="736" width="95" height="28" rx="6" class="chip"/><text x="1372" y="754" class="mono" text-anchor="middle">change_log</text>
  <text x="980" y="788" class="t" font-size="12">Money as whole minor units with ISO 4217 codes; rates kept per date; dashed = view</text>
  <text x="980" y="808" class="t" font-size="12">Every query is filtered to the signed-in user's country scope</text>
  <text x="980" y="828" class="t" font-size="12">Indexes on filter columns, trigram name search, versioned migrations</text>

  <!-- Delivery -->
  <rect x="260" y="890" width="1440" height="110" rx="12" fill="#F7F7F8" stroke="#71717A" stroke-width="1.5"/>
  <text x="280" y="916" class="t h" font-size="15">Delivery</text>
  <rect x="280" y="930" width="240" height="55" rx="6" class="box" stroke="#71717A"/>
  <text x="400" y="953" class="t h" font-size="13" text-anchor="middle">GitHub repository</text>
  <text x="400" y="972" class="muted" font-size="11" text-anchor="middle">small, test-first commits</text>
  <line x1="520" y1="957" x2="588" y2="957" class="line"/>
  <rect x="590" y="930" width="360" height="55" rx="6" class="box" stroke="#71717A"/>
  <text x="770" y="953" class="t h" font-size="13" text-anchor="middle">GitHub Actions</text>
  <text x="770" y="972" class="muted" font-size="11" text-anchor="middle">lint, type check, tests and build on every push; daily rates job</text>
  <line x1="950" y1="957" x2="1018" y2="957" class="line"/>
  <rect x="1020" y="930" width="360" height="55" rx="6" class="box" stroke="#71717A"/>
  <text x="1200" y="953" class="t h" font-size="13" text-anchor="middle">Deploy on merge to main</text>
  <text x="1200" y="972" class="muted" font-size="11" text-anchor="middle">UI to Vercel, API to Render, migrations first</text>
  <rect x="1410" y="930" width="270" height="55" rx="6" class="box" stroke="#71717A" stroke-dasharray="5 4"/>
  <text x="1545" y="953" class="t h" font-size="13" text-anchor="middle">Configuration</text>
  <text x="1545" y="972" class="muted" font-size="11" text-anchor="middle">secrets as environment variables</text>

  <!-- Arrows -->
  <line x1="222" y1="225" x2="257" y2="225" class="line"/>
  <line x1="620" y1="225" x2="703" y2="225" class="line"/>
  <line x1="620" y1="400" x2="703" y2="400" class="line"/>
  <path d="M874,392 L925,392 L925,205 L977,205" class="line"/>
  <line x1="1375" y1="486" x2="1375" y2="607" class="line"/>
  <path d="M960,540 L930,540 L930,650 L893,650" class="line"/>
  <line x1="690" y1="650" x2="223" y2="650" class="line"/>
  <line x1="130" y1="607" x2="130" y2="330" class="dash"/>
  <text x="120" y="455" class="muted" font-size="11" text-anchor="end">link opens</text>
  <text x="120" y="470" class="muted" font-size="11" text-anchor="end">the app</text>
  <line x1="620" y1="765" x2="957" y2="765" class="line"/>
  <line x1="1500" y1="220" x2="1463" y2="220" class="line"/>
  <line x1="1460" y1="370" x2="1497" y2="370" class="line"/>

  <!-- Badges -->
  <g class="badge"><circle cx="240" cy="205" r="11"/><text x="240" y="205">1</text></g>
  <g class="badge"><circle cx="661" cy="207" r="11"/><text x="661" y="207">2</text></g>
  <g class="badge"><circle cx="661" cy="382" r="11"/><text x="661" y="382">3</text></g>
  <g class="badge"><circle cx="925" cy="300" r="11"/><text x="925" y="300">3</text></g>
  <g class="badge"><circle cx="1375" cy="585" r="11"/><text x="1375" y="585">4</text></g>
  <g class="badge"><circle cx="930" cy="595" r="11"/><text x="930" y="595">5</text></g>
  <g class="badge"><circle cx="455" cy="650" r="11"/><text x="455" y="650">6</text></g>
  <g class="badge"><circle cx="790" cy="765" r="11"/><text x="790" y="765">7</text></g>
  <g class="badge"><circle cx="985" cy="937" r="11"/><text x="985" y="937">8</text></g>
  <g class="badge"><circle cx="1481" cy="200" r="11"/><text x="1481" y="200">9</text></g>
  <g class="badge"><circle cx="1480" cy="350" r="11"/><text x="1480" y="350">10</text></g>

  <!-- Legend -->
  <text x="40" y="1035" class="t h" font-size="15">Flows</text>
  <g font-size="12.5">
    <g class="badge lg"><circle cx="49" cy="1058" r="9"/><text x="49" y="1058">1</text></g>
    <text x="66" y="1062" class="t">HR managers use the application in a desktop browser; country HR users see only their country.</text>
    <g class="badge lg"><circle cx="49" cy="1082" r="9"/><text x="49" y="1082">2</text></g>
    <text x="66" y="1086" class="t">The browser loads the built React app from Vercel.</text>
    <g class="badge lg"><circle cx="49" cy="1106" r="9"/><text x="49" y="1106">3</text></g>
    <text x="66" y="1110" class="t">Calls to /api are forwarded by Vercel to the API; the JWT is sent in an httpOnly cookie.</text>
    <g class="badge lg"><circle cx="49" cy="1130" r="9"/><text x="49" y="1130">4</text></g>
    <text x="66" y="1134" class="t">The API reads and writes PostgreSQL; paging, filters and statistics run in SQL.</text>
    <g class="badge lg"><circle cx="49" cy="1154" r="9"/><text x="49" y="1154">5</text></g>
    <text x="66" y="1158" class="t">For password resets and new users, the API asks Brevo to send a single-use link.</text>

    <g class="badge lg"><circle cx="869" cy="1058" r="9"/><text x="869" y="1058">6</text></g>
    <text x="886" y="1062" class="t">Brevo delivers the email; the link opens the reset or set-password screen.</text>
    <g class="badge lg"><circle cx="869" cy="1082" r="9"/><text x="869" y="1082">7</text></g>
    <text x="886" y="1086" class="t">The seed script loads the same 10,000 synthetic employees in four countries on every run.</text>
    <g class="badge lg"><circle cx="869" cy="1106" r="9"/><text x="869" y="1106">8</text></g>
    <text x="886" y="1110" class="t">Every push runs lint, type check and tests; merges to main deploy the UI and API.</text>
    <g class="badge lg"><circle cx="869" cy="1130" r="9"/><text x="869" y="1130">9</text></g>
    <text x="886" y="1134" class="t">A daily scheduled job asks the API to refresh the exchange rates.</text>
    <g class="badge lg"><circle cx="869" cy="1154" r="9"/><text x="869" y="1154">10</text></g>
    <text x="886" y="1158" class="t">The API fetches the latest USD rates from Frankfurter and stores them by date.</text>
  </g>
</svg>
