# Render Blueprint for the API: free plan, in the same region as the Neon database (AWS us-east-2).
services:
  - type: web
    name: acme-salary-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    # Migrations run in the build, before the new version starts (Render's free plan has no
    # pre-deploy step). A failed migration fails the deploy and the running version stays up.
    buildCommand: npm ci --omit=dev && npm run db:migrate -w @salary/api
    # Node.js 24 runs the TypeScript source directly (decision D39).
    startCommand: node apps/api/src/server.ts
    healthCheckPath: /api/health
    # Deploy only after the CI workflow has passed on the commit.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - .nvmrc
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Pooled connection string of the Neon production branch, set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
